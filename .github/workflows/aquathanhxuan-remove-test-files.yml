name: Aqua Thanh Xuan remove test-only source files (one-time)

on:
  push:
    branches: [main]
    paths:
      - bootstrap/aquathanhxuan-remove-test-files.ready

permissions:
  contents: read

concurrency:
  group: source-commit-aquathanhxuan-remove-test-files
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      EXPECTED_BASE_SHA: 7cdf57e46a43ef7c362a7022d5a715ac2bde871a
    steps:
      - name: Checkout audited control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Verify authorization and target allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/aquathanhxuan-remove-test-files.ready)" = "AQUATHANHXUAN_REMOVE_TEST_FILES_V1"
          test -n "$SOURCE_REPO_PAT"
          python3 - <<'PY'
          import json
          cfg=json.load(open('control/config/targets.json',encoding='utf-8'))
          target=cfg['targets']['ngocnhanvo/aquathanhxuan-astro']
          branch=target['branches']['master']
          assert target.get('allow_deletions') is True
          assert 'direct_commit' in branch.get('modes',[])
          assert 'node' in branch.get('validation_presets',[])
          print('AQUATHANHXUAN_TEST_DELETE_ALLOWLIST=PASS')
          PY

      - name: Checkout exact Aqua Thanh Xuan Astro master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies and capture inherited Astro check baseline
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          set +e
          pnpm run check > /tmp/check-before.log 2>&1
          status=$?
          set -e
          echo "BASELINE_CHECK_STATUS=$status"
          python3 - <<'PY'
          import re
          raw=open('/tmp/check-before.log',encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*m','',raw)
          errors=sorted(line.strip() for line in raw.splitlines() if ' - error ' in line)
          open('/tmp/errors-before.txt','w',encoding='utf-8').write('\n'.join(errors)+'\n')
          print('BASELINE_TYPE_ERRORS='+str(len(errors)))
          PY

      - name: Remove exact test-only files
        shell: bash
        run: |
          set -euo pipefail
          cd target
          files=(
            "scripts/inject-handler.portability.test.ts"
            "scripts/inject-handler.redirects.test.ts"
            "scripts/pm2-ecosystem.test.ts"
            "scripts/product-category-cache.test.ts"
            "scripts/ssr-static-404.test.ts"
            "scripts/sync-seo-files.revision.test.ts"
            "scripts/sync-seo-files.test.ts"
            "src/astroreact/navigation.test.ts"
            "src/lib/agentSession.test.ts"
            "src/lib/seo/listingTitles.test.ts"
            "src/lib/seo/wordpressUploadProxy.test.ts"
            "src/lib/wordpress/builderAutoDiscovery.test.mjs"
            "src/lib/wordpress/builderAutoText.test.mjs"
            "src/lib/wordpress/builderEditabilityCues.test.ts"
            "src/lib/wordpress/builderFooterAssetsSnapshot.test.ts"
            "src/lib/wordpress/builderFooterSelection.test.ts"
            "src/lib/wordpress/builderHeaderNavLock.test.ts"
            "src/lib/wordpress/builderPreviewControls.test.ts"
            "src/lib/wordpress/builderSectionDrafts.test.ts"
            "src/lib/wordpress/cache.menu.test.ts"
            "src/lib/wordpress/footerInfoSources.test.ts"
            "src/lib/wordpress/menus/index.test.ts"
            "src/lib/wordpress/pages/getData.image-errors.test.ts"
            "src/lib/wordpress/products/getDataFromLogs.test.ts"
            "src/lib/wordpress/redirects/registry.bounded-concurrency.test.ts"
            "src/lib/wordpress/tablepress/footerAssets.test.ts"
            "src/lib/wordpress/tablepress/processedCache.test.ts"
            "src/pages/api/contact/contact-config.test.ts"
          )
          test "${#files[@]}" -eq 28
          for f in "${files[@]}"; do
            test -f "$f" || { echo "::error::Expected test file missing: $f"; exit 1; }
            git rm -- "$f"
          done
          test "$(git diff --cached --name-status | awk '$1=="D"{count++} END{print count+0}')" -eq 28
          test -z "$(git ls-files | grep -E '(^|/)(__tests__/|tests?/)|\.(test|spec)\.[^/]+$' || true)"
          if git grep -nE "from[[:space:]]+['\"]vitest['\"]|require\(['\"]vitest['\"]\)" -- src scripts; then
            echo "::error::Runtime source still imports vitest"
            exit 1
          fi
          git diff --cached --check
          echo "AQUATHANHXUAN_TEST_ONLY_FILES_REMOVED=28"

      - name: Validate deletion does not add Astro errors
        shell: bash
        run: |
          set -euo pipefail
          cd target
          set +e
          pnpm run check > /tmp/check-after.log 2>&1
          status=$?
          set -e
          echo "AFTER_CHECK_STATUS=$status"
          python3 - <<'PY'
          import re
          before=set(open('/tmp/errors-before.txt',encoding='utf-8').read().splitlines())
          raw=open('/tmp/check-after.log',encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*m','',raw)
          after=set(line.strip() for line in raw.splitlines() if ' - error ' in line)
          new=sorted(after-before)
          print('AFTER_TYPE_ERRORS='+str(len(after)))
          if new:
              print('NEW_TYPE_ERRORS:')
              print('\n'.join(new))
              raise SystemExit('Test cleanup introduced new Astro errors')
          print('TYPE_ERROR_PARITY=PASS')
          PY
          node -e "const fs=require('fs'); const p='src/pages/api/contact/contact-config.test.ts'; if(fs.existsSync(p)) process.exit(1); console.log('CONTACT_TEST_ROUTE_ABSENT=PASS')"

      - name: Commit and publish exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd target
          git config user.name "source-commit-actions[bot]"
          git config user.email "source-commit-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(tests): remove test-only source files"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          git push origin HEAD:refs/heads/master
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote --heads origin refs/heads/master | cut -f1)"
          test -n "$actual" && test "$actual" = "$expected"
          echo "AQUATHANHXUAN_TEST_CLEANUP_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "AQUATHANHXUAN_TEST_CLEANUP_PASS $actual"
