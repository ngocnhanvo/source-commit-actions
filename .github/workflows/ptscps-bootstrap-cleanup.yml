name: PTSCPS bootstrap generated-file cleanup (one-time)
on:
  push:
    branches: [main]
    paths:
      - bootstrap/ptscps-cleanup.ready
permissions:
  contents: read
concurrency:
  group: source-commit-ptscps-bootstrap-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Checkout control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Verify fixed authorization
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/ptscps-cleanup.ready)" = PTSCPS_REMOVE_GENERATED_PYC_V1
          test -n "$SOURCE_REPO_PAT"
      - name: Checkout only PTSCPS Actions main
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-actions
          ref: main
          path: target
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Remove precisely three generated bytecode artifacts and verify published SHA
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd target
          test "$(git ls-files 'scripts/__pycache__/*.pyc' | wc -l)" -eq 3
          git ls-files 'scripts/__pycache__/*.pyc' | sort > /tmp/found-pyc
          printf '%s\n' \
            scripts/__pycache__/ptscps-php-live-release.cpython-312.pyc \
            scripts/__pycache__/ptscps-published-sitemap-revision.cpython-312.pyc \
            scripts/__pycache__/ptscps-remote-unzip.cpython-312.pyc | sort > /tmp/expected-pyc
          diff -u /tmp/expected-pyc /tmp/found-pyc
          git rm -q -- \
            scripts/__pycache__/ptscps-php-live-release.cpython-312.pyc \
            scripts/__pycache__/ptscps-published-sitemap-revision.cpython-312.pyc \
            scripts/__pycache__/ptscps-remote-unzip.cpython-312.pyc
          git diff --cached --name-only | sort > /tmp/staged
          diff -u /tmp/expected-pyc /tmp/staged
          git config user.name "PTSCPS Source Bootstrap"
          git config user.email "ptscps-bootstrap@users.noreply.github.com"
          git commit -q -m "chore: remove generated Python bytecode from PTSCPS Actions"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          git push origin HEAD:refs/heads/main
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          test -n "$actual" && test "$actual" = "$expected"
          echo "PTSCPS_ACTIONS_CLEAN_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "PTSCPS_CLEANUP_PASS $actual"
