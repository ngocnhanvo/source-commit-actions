name: Target access smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/target-access-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source repository token
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_REPO_PAT" ]] || {
            echo "::error::SOURCE_REPO_PAT is not configured in source-commit-actions"
            exit 1
          }

      - name: Checkout private target read access
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/psevn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify target write permission without changing repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --dry-run origin HEAD:master
          echo "SOURCE_COMMIT_TARGET_ACCESS=PASS"
