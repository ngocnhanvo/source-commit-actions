name: Aqua Thanh Xuan remove inherited Astro tablepress components (one-time)

on:
  push:
    branches: [main]
    paths:
      - bootstrap/aquathanhxuan-remove-tablepress.ready

permissions:
  contents: read

concurrency:
  group: source-commit-aquathanhxuan-remove-tablepress
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      EXPECTED_BASE_SHA: 3102cb2738c08bee58fb063f19b445ae68053c9b
    steps:
      - name: Checkout audited control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Verify fixed authorization and deletion allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/aquathanhxuan-remove-tablepress.ready)" = "AQUATHANHXUAN_REMOVE_TABLEPRESS_V3"
          test -n "$SOURCE_REPO_PAT"
          python3 - <<'PY'
          import json
          cfg=json.load(open('control/config/targets.json',encoding='utf-8'))
          target=cfg['targets']['ngocnhanvo/aquathanhxuan-astro']
          assert target.get('allow_deletions') is True
          assert 'master' in target.get('branches',{})
          print('AQUATHANHXUAN_DELETE_ALLOWLIST=PASS')
          PY

      - name: Checkout exact Aqua Thanh Xuan Astro master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/aquathanhxuan-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Install frozen dependencies and capture inherited type-check baseline
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          set +e
          pnpm run check > /tmp/check-before.log 2>&1
          status=$?
          set -e
          echo "BASELINE_CHECK_STATUS=$status"
          python3 - <<'PY'
          import re
          raw=open('/tmp/check-before.log',encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*m','',raw)
          errors=sorted(line.strip() for line in raw.splitlines() if ' - error ' in line)
          open('/tmp/errors-before.txt','w',encoding='utf-8').write('\n'.join(errors)+'\n')
          print('BASELINE_TYPE_ERRORS='+str(len(errors)))
          PY

      - name: Verify exact inherited component set and delete it
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git ls-files 'src/astro/tablepress/*' | sort > /tmp/found-tablepress
          cat > /tmp/expected-tablepress <<'EOF'
          src/astro/tablepress/Contact_00.astro
          src/astro/tablepress/Home_00.astro
          src/astro/tablepress/Home_01.astro
          src/astro/tablepress/Home_02.astro
          src/astro/tablepress/Home_03.astro
          src/astro/tablepress/Home_04.astro
          src/astro/tablepress/Home_05.astro
          src/astro/tablepress/Home_06.astro
          src/astro/tablepress/Home_07.astro
          src/astro/tablepress/Home_08.astro
          src/astro/tablepress/Home_09.astro
          src/astro/tablepress/Home_10.astro
          src/astro/tablepress/Home_11.astro
          src/astro/tablepress/Home_12.astro
          src/astro/tablepress/Home_13.astro
          EOF
          sort -o /tmp/expected-tablepress /tmp/expected-tablepress
          diff -u /tmp/expected-tablepress /tmp/found-tablepress
          xargs -r git rm -- < /tmp/expected-tablepress
          test -z "$(git ls-files 'src/astro/tablepress/*')"

          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/lib/wordpress/builderPreviewControls.test.ts')
          source=path.read_text(encoding='utf-8')
          obsolete='''  it.each([
    ["Home_00.astro","data-slider-prev"],["Home_00.astro","data-slider-next"],
    ["Home_13.astro","data-customer-prev"],["Home_13.astro","data-customer-next"],
  ])("preserves existing native slider controls from %s %s", (file,selector)=>{
    const component=readFileSync(resolve(process.cwd(),"src/astro/tablepress",file),"utf8");
    const button=(component.match(/<button\\b[\\s\\S]*?>/g)||[]).find(tag=>tag.includes(selector));
    expect(button).toBeDefined();
    expect(button).toContain('data-esc-builder-preview-action={Astro.locals.escBuilderPreview ? "yes" : undefined}');
    const markup=button!.replace(/data-esc-builder-preview-action=\\{[^}]+\\}/,'data-esc-builder-preview-action')
      .replace(/<button\\b/,'<button id="target"')+"Next</button>";
    expect(safe(markup)).toBe(true);
    expect(safe(markup,true)).toBe(false);
  });
'''
          if source.count(obsolete) != 1:
              raise SystemExit('Expected exactly one obsolete tablepress component test block')
          path.write_text(source.replace(obsolete,''),encoding='utf-8')
          PY
          git add src/lib/wordpress/builderPreviewControls.test.ts

          {
            cat /tmp/expected-tablepress
            echo src/lib/wordpress/builderPreviewControls.test.ts
          } | sort > /tmp/expected-changed
          git diff --cached --name-only | sort > /tmp/staged
          diff -u /tmp/expected-changed /tmp/staged
          git diff --cached --check

      - name: Validate deletion introduces no new Astro type errors and tests pass
        shell: bash
        run: |
          set -euo pipefail
          cd target
          set +e
          pnpm run check > /tmp/check-after.log 2>&1
          status=$?
          set -e
          echo "AFTER_CHECK_STATUS=$status"
          python3 - <<'PY'
          import re
          before=set(open('/tmp/errors-before.txt',encoding='utf-8').read().splitlines())
          raw=open('/tmp/check-after.log',encoding='utf-8',errors='replace').read()
          raw=re.sub(r'\x1b\[[0-9;]*m','',raw)
          after=set(line.strip() for line in raw.splitlines() if ' - error ' in line)
          new=sorted(after-before)
          print('AFTER_TYPE_ERRORS='+str(len(after)))
          if new:
              print('NEW_TYPE_ERRORS:')
              print('\n'.join(new))
              raise SystemExit('Deletion introduced new Astro type errors')
          print('TYPE_ERROR_PARITY=PASS')
          PY
          pnpm run test:run

      - name: Commit and publish exact deletion
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd target
          git config user.name "source-commit-actions[bot]"
          git config user.email "source-commit-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(tablepress): remove inherited Astro components and stale tests"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          git push origin HEAD:refs/heads/master
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote --heads origin refs/heads/master | cut -f1)"
          test -n "$actual" && test "$actual" = "$expected"
          echo "AQUATHANHXUAN_TABLEPRESS_DELETE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "AQUATHANHXUAN_TABLEPRESS_DELETE_PASS $actual"
