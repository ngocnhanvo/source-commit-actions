name: Aqua Thanh Xuan one-time template bootstrap (source-commit control)

on:
  push:
    branches: [main]
    paths:
      - bootstrap/aquathanhxuan-v1.ready

permissions:
  contents: read

concurrency:
  group: source-commit-aquathanhxuan-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: astro
            source_repo: ngocnhanvo/template-astro
            source_branch: master
            target_repo: ngocnhanvo/aquathanhxuan-astro
            target_branch: master
          - project: php
            source_repo: ngocnhanvo/template-php
            source_branch: master
            target_repo: ngocnhanvo/aquathanhxuan-php
            target_branch: master
          - project: actions
            source_repo: ngocnhanvo/template-actions
            source_branch: main
            target_repo: ngocnhanvo/aquathanhxuan-actions
            target_branch: main
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      PROJECT: ${{ matrix.project }}
      TARGET_REPO: ${{ matrix.target_repo }}
      TARGET_BRANCH: ${{ matrix.target_branch }}
    steps:
      - name: Checkout audited control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false

      - name: Verify one-time project authorization and allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/aquathanhxuan-v1.ready)" = "AQUATHANHXUAN_BOOTSTRAP_APPROVED_V1"
          test -n "$SOURCE_REPO_PAT"
          case "$PROJECT:$TARGET_REPO:$TARGET_BRANCH" in
            astro:ngocnhanvo/aquathanhxuan-astro:master|php:ngocnhanvo/aquathanhxuan-php:master|actions:ngocnhanvo/aquathanhxuan-actions:main) ;;
            *) echo "::error::Refusing unknown Aqua Thanh Xuan project target"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os
          cfg=json.load(open('control/config/targets.json',encoding='utf-8'))
          repo=os.environ['TARGET_REPO']
          branch=os.environ['TARGET_BRANCH']
          target=cfg.get('targets',{}).get(repo)
          if not target or branch not in target.get('branches',{}):
              raise SystemExit('Target/branch is not allowlisted in source-commit control')
          print('ALLOWLIST_TARGET=PASS', repo, branch)
          PY

      - name: Checkout exactly approved template
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.source_branch }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Copy all tracked template assets and personalize
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile control/scripts/bootstrap-aquathanhxuan.py
          python3 control/scripts/bootstrap-aquathanhxuan.py --project "$PROJECT" --source source --destination target
          echo "TEMPLATE_SOURCE_REPO=${{ matrix.source_repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "TEMPLATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Push immutable initial Git commit only if target has no branches
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git -C target init -b "$TARGET_BRANCH"
          git -C target config user.name "Aqua Thanh Xuan Source Bootstrap"
          git -C target config user.email "aquathanhxuan-bootstrap@users.noreply.github.com"
          git -C target add -A
          git -C target commit -q -m "chore(bootstrap): inherit Aqua Thanh Xuan from approved template"
          git -C target remote add origin "https://github.com/$TARGET_REPO.git"

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"

          existing="$(git -C target ls-remote --heads origin)"
          if [ -n "$existing" ]; then
            echo "::error::Target already has branches. Refusing to overwrite initialization."
            exit 1
          fi

          git -C target push origin "HEAD:refs/heads/$TARGET_BRANCH"

          actual="$(git -C target ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          expected="$(git -C target rev-parse HEAD)"
          test -n "$actual" && test "$actual" = "$expected"

          echo "BOOTSTRAP_TARGET=$TARGET_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "BOOTSTRAP_BRANCH=$TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "BOOTSTRAP_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "AQUATHANHXUAN_BOOTSTRAP_SUCCESS: $TARGET_REPO $TARGET_BRANCH $actual"
