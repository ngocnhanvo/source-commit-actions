name: PTSCPS WordPress bootstrap bytecode cleanup (one-time)
on:
  push:
    branches: [main]
    paths: [bootstrap/ptscps-wp-pyc-cleanup.ready]
permissions:
  contents: read
concurrency:
  group: source-commit-ptscps-wp-pyc-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
    steps:
      - name: Checkout source commit control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Verify fixed cleanup authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/ptscps-wp-pyc-cleanup.ready)" = 'PTSCPS_REMOVE_WP_BOOTSTRAP_PYC_V1'
          test -n "$SOURCE_REPO_PAT"
      - name: Checkout only PTSCPS Actions main
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/ptscps-actions
          ref: main
          path: target
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Remove exactly one generated Python bytecode artifact
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd target
          expected_head='5cc2d24ebe550d53b8858942be8281d26dfd4761'
          test "$(git rev-parse HEAD)" = "$expected_head"
          artifact='scripts/__pycache__/ptscps-wordpress-bootstrap.cpython-312.pyc'
          test "$(git ls-files -- "$artifact")" = "$artifact"
          git rm -q -- "$artifact"
          test "$(git diff --cached --name-only)" = "$artifact"
          git config user.name 'PTSCPS Source Bootstrap'
          git config user.email 'ptscps-bootstrap@users.noreply.github.com'
          git commit -q -m 'chore: remove generated PTSCPS WordPress bootstrap bytecode'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          git push origin HEAD:refs/heads/main
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote --heads origin refs/heads/main | cut -f1)"
          test -n "$actual" && test "$actual" = "$expected"
          echo "PTSCPS_WP_BOOTSTRAP_PYC_CLEAN_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
