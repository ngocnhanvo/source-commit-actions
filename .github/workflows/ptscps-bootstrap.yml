name: PTSCPS one-time template bootstrap (source-commit control)
on:
  push:
    branches: [main]
    paths:
      - bootstrap/ptscps-v1.ready
permissions:
  contents: read
concurrency:
  group: source-commit-ptscps-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'ngocnhanvo/source-commit-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: astro
            source_repo: ngocnhanvo/template-astro
            source_branch: master
            target_repo: ngocnhanvo/ptscps-astro
            target_branch: master
          - project: php
            source_repo: ngocnhanvo/template-php
            source_branch: master
            target_repo: ngocnhanvo/ptscps-php
            target_branch: master
          - project: actions
            source_repo: ngocnhanvo/template-actions
            source_branch: main
            target_repo: ngocnhanvo/ptscps-actions
            target_branch: main
    env:
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      PROJECT: ${{ matrix.project }}
      TARGET_REPO: ${{ matrix.target_repo }}
      TARGET_BRANCH: ${{ matrix.target_branch }}
    steps:
      - name: Checkout audited control-plane
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Verify one-time project authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat control/bootstrap/ptscps-v1.ready)" = "PTSCPS_BOOTSTRAP_APPROVED_V1"
          test -n "$SOURCE_REPO_PAT"
          case "$PROJECT:$TARGET_REPO:$TARGET_BRANCH" in
            astro:ngocnhanvo/ptscps-astro:master|php:ngocnhanvo/ptscps-php:master|actions:ngocnhanvo/ptscps-actions:main) ;;
            *) echo "::error::Refusing unknown project target"; exit 1 ;;
          esac
      - name: Checkout exactly approved template
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.source_branch }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Copy all tracked template assets and personalize
        shell: bash
        run: |
          set -euo pipefail
          python3 control/scripts/bootstrap-ptscps.py --project "$PROJECT" --source source --destination target
          echo "TEMPLATE_SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Push immutable initial Git commit only if target has no branches
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git -C target init -b "$TARGET_BRANCH"
          git -C target config user.name "PTSCPS Source Bootstrap"
          git -C target config user.email "ptscps-bootstrap@users.noreply.github.com"
          git -C target add -A
          git -C target commit -q -m "chore(bootstrap): inherit and personalize PTSCPS from approved template"
          git -C target remote add origin "https://github.com/$TARGET_REPO.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_REPO_PAT" | base64 -w0)"
          existing="$(git -C target ls-remote --heads origin)"
          if [ -n "$existing" ]; then
            echo "::error::Target already has branches. Refusing to overwrite initialization."
            exit 1
          fi
          git -C target push origin "HEAD:refs/heads/$TARGET_BRANCH"
          if [ "$PROJECT" = astro ]; then
            git -C target push origin HEAD:refs/heads/github
          fi
          actual="$(git -C target ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          expected="$(git -C target rev-parse HEAD)"
          test -n "$actual" && test "$actual" = "$expected"
          echo "BOOTSTRAP_TARGET=$TARGET_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "BOOTSTRAP_BRANCH=$TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "BOOTSTRAP_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "PTSCPS_BOOTSTRAP_SUCCESS: $TARGET_REPO $TARGET_BRANCH $actual"
